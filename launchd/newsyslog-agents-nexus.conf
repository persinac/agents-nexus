# Rotate agents-nexus job logs. Placeholders are substituted at install time:
#   sed -e "s|__HOME__|$HOME|g" -e "s|__USER__|$(id -un)|g" -e "s|__GROUP__|$(id -gn)|g" \
#     ~/garner/repos/agents-nexus/launchd/newsyslog-agents-nexus.conf \
#     | sudo tee /etc/newsyslog.d/agents-nexus.conf >/dev/null
#   sudo chmod 644 /etc/newsyslog.d/agents-nexus.conf
#
# logfilename                              [owner:group]      mode count size(KB) when  flags
__HOME__/Library/Logs/agents-nexus/*.log  __USER__:__GROUP__  644  7     1024     *     GJ
